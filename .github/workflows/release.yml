name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases
  packages: write # push image to GitHub Container Registry

jobs:
  release:
    name: Test, build image & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Gate the release on a passing test suite ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # --- Determine a version string (git tag, or short SHA for manual runs) ---
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # --- Build & push the Docker image to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      # --- Package a source archive to attach to the Release ---
      - name: Build source archive
        run: |
          mkdir -p dist
          tar --exclude-vcs \
              --exclude='./dist' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              -czf "dist/gold-waff-${{ steps.version.outputs.version }}.tar.gz" \
              app requirements.txt Dockerfile README.md LICENSE

      # --- Publish the GitHub Release (tag runs only) ---
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Generator Service Orchestration ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/gold-waff-${{ steps.version.outputs.version }}.tar.gz
          body: |
            ## Generator Service Orchestration Framework ${{ steps.version.outputs.version }}

            FastAPI backend that coordinates the generator service lifecycle
            (dispatch, inventory, maintenance, contracts, billing, predictive
            maintenance, reporting).

            ### Container image
            ```
            docker pull ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            docker run -p 8000:8000 ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ```
            Then open http://localhost:8000/docs

            ### Source archive
            The attached `gold-waff-${{ steps.version.outputs.version }}.tar.gz`
            contains the app, `requirements.txt`, and `Dockerfile`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
